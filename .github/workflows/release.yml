# release — cut a micke release: test, cross-compile, publish.
#
# Purpose: a pushed v* tag is the single lever that produces a full release.
# scripts/build.ts cross-compiles all five assets (linux amd64/arm64, darwin
# arm64, windows amd64/arm64 — no darwin-amd64, matching the rungv asset map)
# on this one runner and writes SHA256SUMS, then `gh release create dist/*`
# publishes binaries + sums together. Asset names are the updater's
# contract, asserted by scripts/build.ts — a red build here can never ship
# a misnamed or missing asset.
#
# The fast test tier runs BEFORE the build: a broken tree must not release,
# and the fast tier is exactly the gate that runs locally (bun test tests/,
# no network, no sandbox) — what a developer saw green is what releases.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create uploads the release assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7 # same major the image workflow pins

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # the version the cross-compile matrix was verified with

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the fast tests (release gate)
        run: bun test tests/

      - name: Cross-compile every release asset + SHA256SUMS
        run: bun scripts/build.ts "${GITHUB_REF_NAME}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "micke ${GITHUB_REF_NAME}" --generate-notes
