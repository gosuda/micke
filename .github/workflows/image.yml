# image — build and push the micke desktop image to ghcr.io.
#
# Purpose: maintainer-side build leg of the pull-based image distribution
# decided on 2026-11-02 (docs/research/gvx-only-analysis.md §10) — Docker is
# removed as a runtime (gvx-only), so users `rungv pull` / `docker pull` the
# image from ghcr.io instead of building it; `docker save` → `rungv load`
# remains the air-gapped fallback. This workflow is the only place the image
# is built going forward.
#
# Build-context contract: the Dockerfile lives in image/ but its COPY sources
# (image/entrypoint.sh, image/micke-chromium.sh) are relative to the REPO
# ROOT. The verified local build is `docker build -t micke -f image/Dockerfile .`
# — so here context is `.` (repo root) and `file` points at image/Dockerfile.
# Do not "fix" this to context: ./image; the COPY lines would break.

name: image

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/image.yml' # the commit adding this file self-triggers
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gosuda/micke
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: . # repo root — see header comment
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
