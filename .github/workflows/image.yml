# image — build and push the micke desktop image to ghcr.io.
#
# Purpose: the maintainer-side build leg of the pull-based image distribution.
# micke's runtime is gvx-only (owner MUST 2026-11-02): users `rungv pull` this
# image (set MICKE_IMAGE), never build it. Docker is used HERE as the build
# tool (Buildx/build-push-action) and `docker save` → `rungv load` remains the
# air-gapped ingest fallback — Docker is not a session runtime. This workflow
# is the only place the image is built going forward.
#
# Build-context contract: the Dockerfile lives in image/ but its COPY sources
# (image/entrypoint.sh, image/driver.sh, image/micke-chromium.sh) are relative
# to the REPO ROOT. The verified local build is `docker build -t micke -f
# image/Dockerfile .` — so here context is `.` (repo root) and `file` points at
# image/Dockerfile. Do not "fix" this to context: ./image; the COPY lines would
# break.

name: image

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/image.yml' # the commit adding this file self-triggers
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gosuda/micke
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: . # repo root — see header comment
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
