# image — build and push the multi-arch micke desktop image to ghcr.io.
#
# Purpose: the maintainer-side build leg of the pull-based image distribution.
# micke's runtime is gvx-only: users `rungv pull` this
# image (set MICKE_IMAGE), never build it. Docker is used HERE as the build
# tool (Buildx/build-push-action) and `docker save` → `rungv load` remains the
# air-gapped ingest fallback — Docker is not a session runtime. This workflow
# is the only place the image is built going forward.
#
# Platform builds are NATIVE, not emulated:
#   - linux/amd64 -> ubuntu-latest
#   - linux/arm64 -> ubuntu-24.04-arm (GitHub-hosted Arm runner, free for
#     PUBLIC repos; the label does not exist for private repos)
# Each job builds and pushes its single platform by digest; the `merge` job
# assembles the final manifest list. No docker/setup-qemu-action anywhere.
#
# Build-context contract: the Dockerfile lives in image/ but its COPY sources
# (image/entrypoint.sh, image/driver.sh, image/chromium-flags.sh) are relative
# to the REPO ROOT. The verified local build is `docker build -t micke -f
# image/Dockerfile .` — so here context is `.` (repo root) and `file` points at
# image/Dockerfile. Do not "fix" this to context: ./image; the COPY lines would
# break.

name: image

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/image.yml' # the commit adding this file self-triggers
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # native Arm runner; no QEMU
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One platform per native runner; push by digest so the merge job can
      # assemble a manifest list without rebuilding under emulation.
      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: . # repo root — see header comment
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=micke
          outputs: type=image,name=ghcr.io/gosuda/micke,push-by-digest=true,name-canonical=true,push=true
          # The merge job assembles the final manifest list from these
          # single-platform digests; keep attestations out until signing
          # so the index is exactly the two platform manifests.
          provenance: false
          cache-from: type=gha,scope=micke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=micke-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gosuda/micke
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/gosuda/micke@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/gosuda/micke:${{ steps.meta.outputs.version }}
